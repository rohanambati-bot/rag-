# .github/workflows/rag_quality_gate.yml
# CI/CD automated evaluation loop for the RAG system.
# 100% self-contained and offline — runs unit tests, property tests,
# semantic caching, and benchmark visualizations with zero external API keys.

name: RAG Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.12.14"

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # Stage 1 — Lint + unit tests (offline)
  # ──────────────────────────────────────────────────────────────────────────
  lint-test:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --requirement requirements.lock

      - name: Ruff Lint Check
        run: ruff check . --select E,F,W --ignore E501

      - name: Run Test Suite
        run: pytest -q tests/

  # ──────────────────────────────────────────────────────────────────────────
  # Stage 2 — Benchmark verification, Semantic Cache test & Plot Generation
  # ──────────────────────────────────────────────────────────────────────────
  benchmark-and-visuals:
    name: Benchmark & Visualizations
    runs-on: ubuntu-latest
    needs: lint-test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install --requirement requirements.lock

      - name: Test Semantic Cache (In-Memory HNSW)
        run: python main.py --mode cache-demo

      - name: Generate Benchmark Visualizations & Report
        run: python main.py --mode demo

      - name: Upload Evaluation Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-report-${{ github.sha }}
          path: outputs/evaluation_report.md

      - name: Upload Benchmark Plots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-plots-${{ github.sha }}
          path: outputs/plots/

  # ──────────────────────────────────────────────────────────────────────────
  # Stage 3 — bounded clean Linux container smoke test
  # ──────────────────────────────────────────────────────────────────────────
  container-smoke:
    name: Linux Container Smoke Test
    runs-on: ubuntu-latest
    needs: lint-test
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build the production image
        run: docker build --file Dockerfile --tag rag-framework:${{ github.sha }} .

      - name: Start the API without a corpus
        run: |
          docker run --detach --name rag-framework-smoke \
            --publish 18000:8000 \
            --env API_KEY=ci-smoke-key \
            --env ALLOW_UNAUTHENTICATED=false \
            --env HOST=0.0.0.0 \
            --env PYTHON_DOTENV_DISABLED=1 \
            rag-framework:${{ github.sha }}

      - name: Check liveness and authentication boundaries
        timeout-minutes: 6
        run: |
          # Give uvicorn time to bind; then poll robustly (--retry-all-errors
          # covers the 'connection reset' that --retry alone dies on).
          sleep 5
          curl --fail --silent \
            --retry 20 --retry-delay 2 --retry-all-errors \
            --max-time 5 http://127.0.0.1:18000/healthz || {
              echo "── container state on failure ──"
              docker inspect --format 'exit={{.State.ExitCode}} status={{.State.Status}} oom={{.State.OOMKilled}}' rag-framework-smoke || true
              docker logs rag-framework-smoke 2>&1 | tail -80 || true
              exit 1
            }
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --request POST --header 'content-type: application/json' \
            --data '{"question":"smoke"}' http://127.0.0.1:18000/query)" = "401"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --header 'X-API-Key: ci-smoke-key' http://127.0.0.1:18000/readyz)" = "503"

      - name: Remove smoke container
        if: always()
        run: docker rm --force rag-framework-smoke || true
