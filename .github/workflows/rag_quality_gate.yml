# .github/workflows/rag_quality_gate.yml
# CI/CD automated evaluation loop for the RAG system.
# 100% self-contained and offline — runs unit tests, property tests,
# semantic caching, and benchmark visualizations with zero external API keys.

name: RAG Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.12"

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # Stage 1 — Lint + unit tests (220 tests, offline)
  # ──────────────────────────────────────────────────────────────────────────
  lint-test:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ruff Lint Check
        run: ruff check . --select E,F,W --ignore E501

      - name: Run Test Suite (220 tests)
        run: pytest -q tests/

  # ──────────────────────────────────────────────────────────────────────────
  # Stage 2 — Benchmark verification, Semantic Cache test & Plot Generation
  # ──────────────────────────────────────────────────────────────────────────
  benchmark-and-visuals:
    name: Benchmark & Visualizations
    runs-on: ubuntu-latest
    needs: lint-test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Test Semantic Cache (In-Memory HNSW)
        run: python main.py --mode cache-demo

      - name: Generate Benchmark Visualizations & Report
        run: python main.py --mode demo

      - name: Upload Evaluation Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-report-${{ github.sha }}
          path: outputs/evaluation_report.md

      - name: Upload Benchmark Plots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-plots-${{ github.sha }}
          path: outputs/plots/

