# .github/workflows/rag_quality_gate.yml
# CI/CD automated evaluation loop for the RAG system.
# Triggers on every push/PR to main.

name: RAG Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.12"

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # Stage 1 — Lint + unit tests
  # ──────────────────────────────────────────────────────────────────────────
  lint-test:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ruff
        run: ruff check . --select E,F,W --ignore E501

      - name: Pytest
        run: pytest -q tests/

  # ──────────────────────────────────────────────────────────────────────────
  # Stage 2 — Synthetic query run + RAGAS-style scoring + quality gate
  # ──────────────────────────────────────────────────────────────────────────
  ragas-quality-gate:
    name: RAGAS Quality Gate
    runs-on: ubuntu-latest
    needs: lint-test
    env:
      GROQ_API_KEY:       ${{ secrets.GROQ_API_KEY }}
      MISTRAL_API_KEY:    ${{ secrets.MISTRAL_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      JUDGE_PROVIDER:     ${{ vars.JUDGE_PROVIDER || 'groq' }}
      JUDGE_MODEL:        ${{ vars.JUDGE_MODEL || 'openai/gpt-oss-20b' }}
      REDIS_HOST:         localhost
      REDIS_PORT:         "6379"

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore vector store cache
        uses: actions/cache@v4
        with:
          path: data/chroma_db_full
          key: chroma-${{ hashFiles('configs/config.py') }}
          restore-keys: chroma-

      - name: Restore synthetic dataset cache
        uses: actions/cache@v4
        with:
          path: data/synthetic_dataset.json
          key: synthetic-${{ hashFiles('configs/config.py') }}
          restore-keys: synthetic-

      - name: Run preprocessing (if cache miss)
        run: |
          if [ ! -f data/synthetic_dataset.json ]; then
            python -c "from module1.data_preprocessing import run_module1; run_module1(generate_synthetic=True)"
          fi

      - name: Run CI/CD quality gate
        id: quality_gate
        run: |
          if [ -n "$GROQ_API_KEY" ] || [ -n "$MISTRAL_API_KEY" ] || [ -n "$OPENROUTER_API_KEY" ]; then
            echo "Running live LLM quality gate on 50 samples..."
            python main.py --mode cicd --samples 50
          else
            echo "::warning title=Missing API Keys in GitHub Secrets::Neither GROQ_API_KEY, MISTRAL_API_KEY, nor OPENROUTER_API_KEY is configured in repository secrets. Running offline test and demo verification."
            echo "To enable live LLM evaluation, go to: Settings -> Secrets and variables -> Actions -> New repository secret -> GROQ_API_KEY"
            python -m pytest -q
            python main.py --mode demo
          fi

      - name: Upload CI/CD report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cicd-report-${{ github.sha }}
          path: outputs/cicd_report.json

      - name: Upload evaluation plots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-plots-${{ github.sha }}
          path: outputs/plots/

  # ──────────────────────────────────────────────────────────────────────────
  # Stage 3 — Notify on PR failures (only when context.issue.number exists)
  # ──────────────────────────────────────────────────────────────────────────
  notify:
    name: Notify on Gate Failure
    runs-on: ubuntu-latest
    needs: ragas-quality-gate
    if: failure() && github.event_name == 'pull_request'
    steps:
      - name: Post failure comment
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '❌ **RAG Quality Gate FAILED** — at least one metric dropped below threshold. Download the `cicd-report-${{ github.sha }}` artifact for details.'
            })
